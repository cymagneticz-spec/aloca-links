<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The GO-TO for location hire</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: #080808;
      color: #fff;
      min-height: 100vh;
    }

    /* ── Hero background ── */
    .hero {
      position: relative;
      background: url('https://image-cdn.later.com/linkinbio_attachments/page_background/uploads-c16197a5-1a4e-fb7e-0c5c-0b16f944533f/web.jpg')
                  center center / cover no-repeat;
      padding: 36px 20px 28px;
      text-align: center;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.18);
    }
    .hero > * { position: relative; z-index: 1; }

    /* ── Logo ── */
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
    }

    /* ── Tagline ── */
    .tagline { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.01em; margin-bottom: 4px; }
    .sub-tagline { font-size: 0.85rem; color: rgba(255,255,255,0.85); margin-bottom: 16px; }

    /* ── Social icons ── */
    .socials { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
    .socials a { color: #fff; text-decoration: none; opacity: 0.9; }
    .socials svg { width: 22px; height: 22px; fill: currentColor; }

    /* ── Nav buttons ── */
    .nav-buttons { display: flex; flex-direction: column; gap: 10px; max-width: 480px; margin: 0 auto; }
    .nav-btn {
      display: block;
      background: #F0AD5B;
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 16px 20px;
      border: none;
      border-radius: 0;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: #d9933e; }
    .chevron { font-style: normal; margin-left: 6px; }

    /* ── Dropdown ── */
    .dropdown-wrap { position: relative; }
    .dropdown-menu {
      display: none;
      flex-direction: column;
      background: #F0AD5B;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .dropdown-wrap.open .dropdown-menu { display: flex; }
    .dropdown-item {
      display: block;
      color: #fff;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 13px 20px;
      border-top: 1px solid rgba(255,255,255,0.15);
      transition: background 0.15s;
    }
    .dropdown-item:hover { background: rgba(0,0,0,0.12); }

    /* ── IG Grid ── */
    .grid-section { max-width: 935px; margin: 0 auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }
    .grid-cell {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      display: block;
      background: #1a1a1a;
      cursor: pointer;
    }
    .grid-img {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: transform 0.35s ease;
    }
    .grid-cell:hover .grid-img { transform: scale(1.06); }
    .grid-hover {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 55%);
      display: flex;
      align-items: flex-end;
      padding: 10px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .grid-cell:hover .grid-hover { opacity: 1; }
    .grid-label { color: #fff; font-size: 0.72rem; font-weight: 600; line-height: 1.3; }
    .empty-grid { color: #555; padding: 60px; text-align: center; grid-column: 1/-1; font-size: 0.85rem; }

    @media (max-width: 480px) {
      .tagline { font-size: 1.1rem; }
      .grid { gap: 2px; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <img class="avatar"

         alt="Aloca">
    <p class="tagline">The GO-TO for location hire</p>
    <p class="sub-tagline">Click on the images below to be taken to location listings!</p>

    <div class="socials">

        </svg>
      </a>
    </div>

    <div class="nav-buttons">
      <a class="nav-btn" href="https://aloca.com.au/locations" target="_blank" rel="noopener">HIRE A LOCATION</a>

      <div class="nav-btn-wrap dropdown-wrap">
        <button class="nav-btn dropdown-toggle" onclick="this.parentElement.classList.toggle('open')">
          HOSTS <span class="chevron">&#8964;</span>
        </button>
        <div class="dropdown-menu"><a class="dropdown-item" href="https://aloca.com.au/list-your-space" target="_blank" rel="noopener">List Your Space</a><a class="dropdown-item" href="https://aloca.com.au/discovery-call" target="_blank" rel="noopener">Book FREE 15 Minute Discovery Call!</a><a class="dropdown-item" href="https://shootlocationsuccess.com" target="_blank" rel="noopener">Join - Shoot Location Success</a></div>
      </div>
<a class="nav-btn" href="https://shootlocationsuccess.com" target="_blank" rel="noopener">HOW TO BUILD A THRIVING SHOOT LOCATION</a>
    </div>
  </div>

  <section class="grid-section">
    <div class="grid">
      <p class="empty-grid">No posts yet.</p>
    </div>
  </section>

  <script>
    // Close dropdowns when clicking outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.dropdown-wrap')) {
        document.querySelectorAll('.dropdown-wrap.open').forEach(el => el.classList.remove('open'));
      }
    });
  </script>
</body>
</html>
